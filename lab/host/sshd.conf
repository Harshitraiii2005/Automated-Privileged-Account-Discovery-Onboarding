# Read before the distro defaults (first value wins in sshd_config).
HostKey /etc/ssh/ssh_host_ed25519_key
PermitRootLogin prohibit-password
# Kept on deliberately: CPM-style verification logs in with the managed password.
PasswordAuthentication yes
KbdInteractiveAuthentication no
X11Forwarding no
# VERBOSE logs the fingerprint of every key used to log in (audit evidence).
LogLevel VERBOSE
